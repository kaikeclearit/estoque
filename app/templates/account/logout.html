{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logout - ClearIT</title>
    
    <!-- Google Fonts - Titillium Web -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Tema ClearIT -->
    <link rel="stylesheet" href="{% static 'core/css/clearit_theme.css' %}">
    
    <style>
        .logout-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--clearit-gradient);
        }
        
        .logout-card {
            max-width: 450px;
            width: 100%;
            padding: 2rem;
        }
        
        .logout-icon {
            font-size: 4rem;
            color: var(--clearit-azul-claro);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="logout-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="card logout-card shadow-lg">
                        <div class="card-body text-center py-5">
                            <!-- Ícone -->
                            <i class="bi bi-check-circle logout-icon"></i>
                            
                            <!-- Título -->
                            <h3 class="mb-3">Logout realizado com sucesso!</h3>
                            <p class="text-muted mb-4">
                                Você foi desconectado do sistema.
                            </p>

                            <!-- Botões -->
                            <div class="d-grid gap-2">
                                <a href="{% url 'account_login' %}" class="btn btn-primary btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>
                                    Fazer login novamente
                                </a>
                                
                                <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                                    <i class="bi bi-house-door me-2"></i>
                                    Ir para página inicial
                                </a>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="card-footer text-center bg-transparent border-0">
                            <small class="text-muted">
                                <strong>clear</strong><span style="color: var(--clearit-azul-claro);">IT</span> - 
                                Clareza e facilidade no trato com a TI
                            </small>
                        </div>
                    </div>

                    <!-- Copyright -->
                    <div class="text-center mt-4">
                        <p class="text-white small mb-0">
                            <i class="bi bi-c-circle me-1"></i>
                            {% now "Y" %} ClearIT - Todos os direitos reservados
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
