{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center py-5">
                    <div class="mb-4">
                        <i class="bi bi-x-circle-fill text-danger" style="font-size: 100px;"></i>
                    </div>
                    
                    <h2 class="text-danger mb-3">Reserva Cancelada</h2>
                    
                    <p class="lead text-muted mb-4">
                        A reserva foi cancelada e o estoque foi devolvido.
                    </p>
                    
                    <div class="alert alert-info">
                        <i class="bi bi-arrow-counterclockwise me-2"></i>
                        O equipamento voltou para o estoque e está disponível novamente.
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                            <i class="bi bi-house-door me-2"></i>
                            Voltar para o Sistema
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
