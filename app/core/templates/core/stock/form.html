{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <nav aria-label="Trilha de navegação">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'movements_list' %}">Histórico</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
            </ol>
        </nav>
        <h1>{{ title }}</h1>
    </div>
</div>

<div class="card form-panel-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% include 'core/_form_fields.html' with form=form %}
            <div class="form-actions">
                <button type="submit" class="btn {% if btn_class == 'btn-danger' %}btn-danger{% else %}btn-primary{% endif %}">
                    <i class="bi {{ icon|default:'bi-box-arrow-in-down' }} me-1" aria-hidden="true"></i>Confirmar
                </button>
                <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        // --- 1. Busca nos selects de Produto e Cliente (Select2) ---
        // Inicializa por id (nunca pela classe .select2, que o plugin também usa).
        // #id_product_entry é o id do campo de produto no formulário de entrada.
        $('#id_product, #id_product_entry').select2({
            theme: 'bootstrap-5',
            placeholder: 'Digite para pesquisar o produto...',
            allowClear: true,
            width: '100%'
        });

        $('#id_client').select2({
            theme: 'bootstrap-5',
            placeholder: 'Digite para pesquisar o cliente...',
            allowClear: true,
            width: '100%'
        });

        // --- 2. Data prevista de devolução só aparece em EMPRÉSTIMO ---
        const typeSelect = document.getElementById('id_movement_type');
        const dateField = document.getElementById('id_scheduled_date');

        // Só executa se os campos existirem na tela (na tela de Entrada eles não existem)
        if (typeSelect && dateField) {
            const dateContainer = dateField.closest('.mb-3'); // Pega a div pai

            function toggleDate() {
                if (typeSelect.value === 'EMPRESTIMO') {
                    dateContainer.hidden = false;
                } else {
                    // Se não, esconde e limpa o campo
                    dateContainer.hidden = true;
                    dateField.value = '';
                }
            }

            // Executa ao carregar a página
            toggleDate();

            // Executa sempre que o usuário mudar a opção
            typeSelect.addEventListener('change', toggleDate);
        }
    });
</script>
{% endblock %}
