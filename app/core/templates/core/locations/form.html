{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <nav aria-label="Trilha de navegação">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'location_list' %}">Localidades</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
            </ol>
        </nav>
        <h1>{{ title }}</h1>
    </div>
</div>

<div class="card form-panel-sm">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'core/_form_fields.html' with form=form %}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{% url 'location_list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
