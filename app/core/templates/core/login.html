{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ClearIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="card shadow border-0 login-card">
        <div class="text-center mb-4">
            <img src="{% static 'core/img/logo.png' %}" alt="Logo" height="60" class="mb-3">
            <h4 class="fw-bold text-secondary">Acesso Restrito</h4>
            <p class="text-muted small">Entre com suas credenciais</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-danger small py-2">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="Seu usuário" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••" required>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg fw-bold">Entrar</button>
            </div>
            
            <div class="text-center mt-3">
                <hr>
                <a href="{% provider_login_url 'microsoft' %}" class="btn btn-outline-dark w-100 fw-bold">
                    <img src="{% static 'core/img/windows.jpg' %}" 
                                alt="Logo windows" 
                                height="50" 
                    >
                    Entrar com Microsoft
                </a>
            </div>
        </form>
    </div>

</body>
</html>
