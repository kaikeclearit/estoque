{% load static static_version %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="light" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · ClearIT Estoque</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'core/img/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static_v 'core/css/clearit_theme.css' %}">
</head>
<body>
    <main class="auth-page">
        <div class="auth-panel">
            <div class="text-center mb-4">
                <img src="{% static 'core/img/logo.png' %}" alt="ClearIT" class="auth-logo" width="93" height="36">
            </div>

            <div class="card">
                <div class="card-body">
                    <h1 class="h5 mb-1">Entrar</h1>
                    <p class="text-muted small mb-3">Controle de Estoque</p>

                    <form method="post">
                        {% csrf_token %}

                        {% if form.errors %}
                            <div class="alert alert-danger" role="alert" id="login-erro">
                                <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                                <div class="alert-body">Usuário ou senha incorretos.</div>
                            </div>
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label" for="id_username">Usuário</label>
                            <input type="text" name="username" id="id_username" class="form-control"
                                   value="{{ form.username.value|default:'' }}" autocomplete="username"
                                   autocapitalize="none" required autofocus
                                   {% if form.errors %}aria-invalid="true" aria-describedby="login-erro"{% endif %}>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="id_password">Senha</label>
                            <input type="password" name="password" id="id_password" class="form-control"
                                   autocomplete="current-password" required
                                   {% if form.errors %}aria-invalid="true" aria-describedby="login-erro"{% endif %}>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
                    </form>
                </div>
            </div>

            <p class="text-center text-muted small mt-3 mb-0">
                Problemas para acessar? <a href="mailto:kmaciel@clearit.com.br">Fale com o suporte</a>.
            </p>
        </div>
    </main>
</body>
</html>
