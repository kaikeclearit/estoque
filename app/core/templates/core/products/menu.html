{% extends 'core/base.html' %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center mt-4">
    
    <h1 class="mb-5 display-6 fw-bold text-secondary">
        <i class="bi bi-box-seam"></i> Gestão de Produtos
    </h1>

    <div class="row g-4 w-100 justify-content-center" style="max-width: 800px;">
        
        <div class="col-md-5">
            <a href="{% url 'product_list' %}" class="text-decoration-none">
                <div class="card h-100 bg-primary text-white text-center shadow hover-card border-0">
                    <div class="card-body py-5 d-flex flex-column align-items-center justify-content-center">
                        <i class="bi bi-search display-1 mb-3"></i>
                        <h3 class="card-title fw-bold">Pesquisar</h3>
                        <p class="card-text small opacity-75">Ver estoque, filtrar e editar itens</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-5">
            <a href="{% url 'product_create' %}" class="text-decoration-none">
                <div class="card h-100 bg-success text-white text-center shadow hover-card border-0">
                    <div class="card-body py-5 d-flex flex-column align-items-center justify-content-center">
                        <i class="bi bi-plus-circle-dotted display-1 mb-3"></i>
                        <h3 class="card-title fw-bold">Adicionar</h3>
                        <p class="card-text small opacity-75">Cadastrar um novo produto no sistema</p>
                    </div>
                </div>
            </a>
        </div>

    </div>
    
    <div class="mt-5">
        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Voltar para Painel Principal
        </a>
    </div>
</div>

<style>
    .hover-card { transition: transform 0.2s; }
    .hover-card:hover { transform: translateY(-5px); filter: brightness(110%); }
</style>
{% endblock %}
