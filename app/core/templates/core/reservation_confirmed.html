{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center py-5">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 100px;"></i>
                    </div>
                    
                    <h2 class="text-success mb-3">Confirmação Registrada!</h2>
                    
                    <p class="lead text-muted mb-4">
                        A utilização do equipamento foi confirmada com sucesso.
                    </p>
                    
                    <div class="alert alert-success">
                        <i class="bi bi-info-circle me-2"></i>
                        A reserva foi convertida em <strong>saída definitiva</strong> no sistema.
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                            <i class="bi bi-house-door me-2"></i>
                            Voltar para o Sistema
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
