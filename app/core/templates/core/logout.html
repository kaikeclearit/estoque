{% load static static_version %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="light" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sair · ClearIT Estoque</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static_v 'core/css/clearit_theme.css' %}">
</head>

<body>
    <main class="auth-page">
        <div class="auth-panel">
            <div class="text-center mb-4">
                <img src="{% static 'core/img/logo.png' %}" alt="ClearIT" class="auth-logo" width="93" height="36">
            </div>
            <div class="card">
                <div class="card-body">
                    <h1 class="h5 mb-1">Sair do sistema?</h1>
                    <p class="text-muted small mb-3">Você precisará entrar novamente para continuar.</p>

                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Sair</button>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
