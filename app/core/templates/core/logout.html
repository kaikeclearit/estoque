{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sair - ClearIT</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Tema ClearIT -->
    <link rel="stylesheet" href="{% static 'core/css/clearit_theme.css' %}">
    
    <style>
        .logout-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--clearit-gradient);
        }
        .logout-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="logout-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="card logout-card shadow-lg">
                        <div class="card-body text-center py-5">
                            <i class="bi bi-box-arrow-right" style="font-size: 4rem; color: var(--clearit-azul-claro);"></i>
                            
                            <h3 class="mt-4 mb-3">Deseja realmente sair?</h3>
                            <p class="text-muted mb-4">
                                Você será desconectado do sistema.
                            </p>

                            <!-- Formulário de logout -->
                            <form method="post" action="{% url 'account_logout' %}">
                                {% csrf_token %}
                                
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-danger btn-lg">
                                        <i class="bi bi-box-arrow-right me-2"></i>
                                        Sim, sair agora
                                    </button>
                                    
                                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                                        <i class="bi bi-x-circle me-2"></i>
                                        Cancelar
                                    </a>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer text-center bg-transparent border-0">
                            <small class="text-muted">
                                <strong>clear</strong><span style="color: var(--clearit-azul-claro);">IT</span>
                            </small>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <p class="text-white small mb-0">
                            <i class="bi bi-c-circle me-1"></i>
                            {% now "Y" %} ClearIT
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
