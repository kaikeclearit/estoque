{% load static static_version %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="light" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro no sistema · ClearIT Estoque</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static_v 'core/css/clearit_theme.css' %}">
</head>
<body>
    <main class="container-xl">
        <div class="error-page">
            <p class="error-code">Erro 500</p>
            <h1 class="h3 mb-2">Algo deu errado no servidor</h1>
            <p class="text-muted mb-4">
                A falha não foi causada por você. Tente novamente em alguns minutos;
                se continuar, fale com o suporte.
            </p>
            <a href="/" class="btn btn-primary">Voltar ao painel</a>
        </div>
    </main>
</body>
</html>
