# Variante "banco externo": o app roda no Kubernetes (2 réplicas) usando o
# Postgres da VM do Nutanix (mesmo banco da VM => dados únicos, redundância do app).
#
#   kubectl kustomize k8s/db-externo     # revisar
#   kubectl apply -k k8s/db-externo      # aplicar
#
# Diferenças em relação à base (nginx/):
#  - NÃO cria Postgres, PVC nem NetworkPolicy do Postgres no cluster;
#  - DATABASE_HOST aponta para o IP da VM (ajuste abaixo);
#  - migrations rodam SÓ na VM (docker compose up). Não aplique o migrate-job.yaml
#    neste modo; o initContainer "wait-migrations" segura os pods até a VM migrar.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../nginx

patches:
  # Remove o Postgres do cluster
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: postgres-allow-app-only
  # Banco = Postgres da VM
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: supply-config
      data:
        DATABASE_HOST: "10.11.10.10"   # <-- IP DA VM (ajuste se a VM tiver outro IP)
  # O IP 10.11.10.10 é da VM: no Kubernetes o MetalLB escolhe outro IP do pool.
  # Para fixar um IP específico, troque "remove" por:
  #   - op: replace
  #     path: /metadata/annotations/metallb.universe.tf~1loadBalancerIPs
  #     value: "<IP_LIVRE_DO_POOL>"
  # e inclua esse IP em DJANGO_ALLOWED_HOSTS/CSRF no supply-config.yaml.
  - target:
      kind: Service
      name: supply-app-service
    patch: |-
      - op: remove
        path: /metadata/annotations/metallb.universe.tf~1loadBalancerIPs
