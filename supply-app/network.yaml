apiVersion: v1
kind: Service
metadata:
  name: estoque-service
  namespace: lab-tjce-bqzsv
spec:
  selector:
    app: estoque-nginx # (ou o nome que estiver no selector do seu deployment)
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estoque-ingress
  namespace: lab-tjce-bqzsv
spec:
  rules:
  - host: estoque.meulab.local 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: estoque-service
            port:
              number: 80