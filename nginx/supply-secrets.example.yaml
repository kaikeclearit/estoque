# TEMPLATE - NÃO coloque valores reais neste arquivo e NÃO o adicione ao
# kustomization. Prefira criar o Secret direto no cluster:
#
#   kubectl -n lab-tjce-bqzsv create secret generic supply-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=DATABASE_USER='<usuario>' \
#     --from-literal=DATABASE_PASSWORD='<senha forte>'
#
# Se precisar usar arquivo: copie para supply-secrets.yaml (ignorado pelo
# .gitignore), preencha e aplique com kubectl apply -f.
apiVersion: v1
kind: Secret
metadata:
  name: supply-secrets
  namespace: lab-tjce-bqzsv
type: Opaque
stringData:
  # Chave do Django (mínimo 50 caracteres aleatórios)
  DJANGO_SECRET_KEY: "<GERAR_CHAVE_ALEATORIA>"
  # Usados pelo app (DATABASE_*) e pelo Postgres (POSTGRES_USER/PASSWORD via secretKeyRef)
  DATABASE_USER: "<USUARIO_DO_BANCO>"
  DATABASE_PASSWORD: "<SENHA_DO_BANCO>"
