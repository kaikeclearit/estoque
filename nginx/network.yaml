# Único caminho de entrada: Ingress -> supply-app-service -> pods supply-app (8000).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estoque-ingress
  annotations:
    # Anotações do ingress-nginx (ignoradas por outros controllers).
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Com TLS habilitado abaixo, o ingress-nginx já redireciona http->https.
    # Se usar cert-manager, descomente e ajuste o ClusterIssuer:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Confirme a classe disponível no cluster: kubectl get ingressclass
  ingressClassName: nginx
  # TLS: crie o Secret com o certificado do domínio (ou use cert-manager):
  #   kubectl -n lab-tjce-bqzsv create secret tls estoque-clearit-tls \
  #     --cert=fullchain.pem --key=privkey.pem
  # e descomente o bloco abaixo.
  # tls:
  #   - hosts:
  #       - estoque.clearit.com.br
  #     secretName: estoque-clearit-tls
  rules:
    - host: estoque.clearit.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supply-app-service
                port:
                  name: http
